name: Stock Data Automation

on:
  schedule:
    # 每天北京时间 16:30 运行 (UTC 08:30)
    # - cron: '30 8 * * *'
    # 每天北京时间 19:10 运行 (UTC 11:10)
    # 格式为：'分 时 天 月 周'
    - cron: '10 11 * * *'
  workflow_dispatch: # 允许你手动点击按钮测试

jobs:
  run_tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install akshare pandas

      - name: Run Python Script
        run: python fetch_data.py

      - name: Push CSV back to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.csv
          git commit -m "Update stock data $(date +'%Y-%m-%d')" || exit 0
          git push
